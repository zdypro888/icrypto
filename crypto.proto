syntax = "proto3";
package icrypto;

import "google/api/annotations.proto";

option go_package = "github.com/zdypro888/icrypto";

// macOS 计算镜像偏好，不改变对外声明的设备系统版本。
enum MacOSRuntime {
  MACOS_AUTO = 0;
  MACOS_COMPATIBLE = 1;
}

// DRM UIK 选择；AUTO 在已适配的 iPhone7 后端使用 committed UIK。
enum DRMUIKMode {
  DRM_UIK_AUTO = 0;
  DRM_UIK_COMMITTED = 1;
  // 保留明确语义；当前后端未适配 bump/proposed，必须拒绝。
  DRM_UIK_PROPOSED = 2;
}

// 初始化参数分离 DRM 能力和 macOS 镜像偏好，不能再按位组合。
message InitializeRequest {
  reserved 1, 3;
  reserved "type", "controls";
  bytes device = 2;
  bool ios_drm = 4;
  MacOSRuntime macos_runtime = 5;
  DRMUIKMode drm_uik_mode = 6;
  // 指定物理 SEP 手机；路由与旧绑定冲突时必须拒绝。
  string sep_device_udid = 7;
}

// 初始化响应
message InitializeResponse {
  bytes device = 1;
  // 确认显式模式已被后端接受，防止旧服务忽略新字段。
  DRMUIKMode drm_uik_mode = 2;
}

// 同步已初始化 cryptor 使用的设备状态。
//
// Initialize 可能先从真实硬件补全设备标识，调用方随后才取得依赖这些
// 标识的票据。该 RPC 只合并设备数据，不重建 VM、SEP 或 guest session。
message SyncDeviceRequest {
  bytes device = 1;
}

message SyncDeviceResponse {}

// 结束请求
message FinalizeRequest {
  reserved 1;
  reserved "controls";
}

// 结束响应
message FinalizeResponse {}

// DRM 激活握手请求
message DRMActivationHandshakeRequest {
  reserved 1;
  reserved "controls";
}

// DRM 激活握手响应
message DRMActivationHandshakeResponse {
  bytes collection_blob           = 1;
  bytes handshake_request_message = 2;
}

// DRM 激活处理请求
message DRMActivationProcessHandshakeRequest {
  bytes           SUInfo                     = 1;
  bytes           handshake_response_message = 2;
  bytes           serverKP                   = 3;
  reserved 4;
  reserved "controls";
}

// DRM 激活处理响应
message DRMActivationProcessHandshakeResponse {
  bytes UIK = 1;
  bytes RK  = 2;
}

// DRM 激活签名请求
message DRMActivationSignRequest {
  bytes           activation_info_xml = 1;
  reserved 2;
  reserved "controls";
}

// DRM 激活签名响应
message DRMActivationSignResponse {
  bytes fairplay_cert_chain = 1;
  bytes fairplay_signature  = 2;
  bytes RKSignature         = 3;
  bytes sign_act_request    = 4;
  bytes serverKP            = 5;
}

// 只选择本次传统激活签名的实现，不改变 ADI/Validation 会话。
enum ActivationSigningProfile {
  ACTIVATION_SIGNING_CURRENT = 0;
  ACTIVATION_SIGNING_LEGACY_IOS9 = 1;
}

// 一次性签名：不要求 Initialize，不写回设备，不占用调用方现有会话。
message ActivationSignRequest {
  ActivationSigningProfile profile = 1;
  reserved 2;
  reserved "type";
  MacOSRuntime macos_runtime = 5;
  DRMUIKMode drm_uik_mode = 6;
  // 指定物理 SEP 手机；路由与旧绑定冲突时必须拒绝。
  string sep_device_udid = 7;
  bytes device = 3;
  bytes activation_info_xml = 4;
}

// 当前有状态会话的传统激活签名请求，不表示Legacy iOS9。
message ActivationSignInSessionRequest {
  bytes           activation_info_xml = 1;
  reserved 2;
  reserved "controls";
}

// 传统激活签名的通用输出，供独立签名与会话内签名共用。
message ActivationSignResponse {
  bytes sign = 1;
  bytes cert = 2;
}

// 激活记录请求
message DRMActivationExportStateRequest {
  bool            unbrick                   = 1;
  bytes           account_token_certificate = 2;
  bytes           device_certificate        = 3;
  bytes           regulatory_info           = 4;
  bytes           fairplay_key_data         = 5;
  bytes           account_token             = 6;
  bytes           account_token_signature   = 7;
  bytes           unique_device_certificate = 8;
  reserved 9;
  reserved "controls";
}

// 激活记录响应
message DRMActivationExportStateResponse {
  bytes psc_sui     = 1;
}

// ADI 开始配置请求
message ADIStartProvisioningRequest {
  int64           DSID     = 1;
  bytes           SPIM     = 2;
  reserved 3;
  reserved "controls";
}

// ADI 开始配置响应
message ADIStartProvisioningResponse {
  uint64 session = 1;
  bytes  CPIM    = 2;
}

// ADI 结束配置请求
message ADIEndProvisioningRequest {
  uint64          session  = 1;
  int64           DSID     = 2;
  int64           RINFO    = 3;
  bytes           PTM      = 4;
  bytes           TK       = 5;
  bytes           ADI      = 6;
  reserved 7;
  reserved "controls";
}

// ADI 结束配置响应
message ADIEndProvisioningResponse {
  bytes MID = 1;
  bytes OTP = 2;
  bytes ADI = 3;
}

// ADI 生成登录码请求
message ADIGenerateLoginCodeRequest {
  int64           DSID     = 1;
  bytes           ADI      = 2;
  reserved 3;
  reserved "controls";
}

// ADI 生成登录码响应
message ADIGenerateLoginCodeResponse {
  int32  code       = 1;
  uint32 login_code = 2;
}

// Absinthe Hello 请求
message AbsintheHelloRequest {
  int32           mode     = 1;
  reserved 2;
  reserved "controls";
}

// Absinthe Hello 响应
message AbsintheHelloResponse {
  bytes hello_message = 1;
}

// 配置额外Absinthe/PSC会话的BAA选项；BIK字节尚不支持导入，非空必须报错。
message AbsintheAddOptionRequest {
  bytes           bik_key                = 1;
  bytes           baa_cert               = 2;
  bytes           intermediate_root_cert = 3;
  reserved 4;
  reserved "controls";
}

// Absinthe 添加选项响应
message AbsintheAddOptionResponse {}

// 额外Absinthe/PSC握手响应；handshake_response不是NAC输出的validation-data。
message AbsintheActivateSessionRequest {
  bytes           handshake_response = 1;
  bytes           server_key      = 2;
  reserved 3;
  reserved "controls";
}

// Absinthe 激活会话响应
message AbsintheActivateSessionResponse {}

// Absinthe 签名数据请求
message AbsintheSignDataRequest {
  bytes           sign_data = 1;
  reserved 2;
  reserved "controls";
}

// Absinthe 签名数据响应
message AbsintheSignDataResponse {
  bytes signature    = 1;
  bytes out_serv_key = 2;
}

// NAC初始化请求；证书属于本次业务握手，不能跨业务替换。
message NACInitRequest {
  bytes           cert     = 1;
  reserved 2;
  reserved "controls";
}

// NAC初始化输出；后续响应处理与生成VD必须使用同一实例。
message NACInitResponse {
  bytes request = 1;
}

// NAC校验数据请求；response非空时先推进握手，再对原始sign_data生成VD。
message NACGenerateValidationRequest {
  bytes           response  = 1;
  bytes           sign_data = 2;
  reserved 3;
  reserved "controls";
}

// NAC生成的validation-data，不是额外Absinthe/PSC签名。
message NACGenerateValidationResponse {
  bytes validation_data = 1;
}

// SAP 交换请求
message SAPExchangeRequest {
  int32           version  = 1;
  bytes           data     = 2;
  reserved 3;
  reserved "controls";
}

// SAP 交换响应
message SAPExchangeResponse {
  bytes exchange_data = 1;
}

// SAP 质数签名请求
message SAPSignPrimeRequest {
  bytes           sign_data = 1;
  reserved 2;
  reserved "controls";
}

// SAP 质数签名响应
message SAPSignPrimeResponse {
  bytes signature = 1;
}

// SAP 质数验证请求
message SAPVerifyPrimeRequest {
  bytes           data     = 1;
  reserved 2;
  reserved "controls";
}

// SAP 质数验证响应
message SAPVerifyPrimeResponse {}

// SAP 签名请求
message SAPSignRequest {
  bytes           sign_data = 1;
  reserved 2;
  reserved "controls";
}

// SAP 签名响应
message SAPSignResponse {
  bytes signature = 1;
}

// SAP 验证请求
message SAPVerifyRequest {
  bytes           data      = 1;
  bytes           signature = 2;
  reserved 3;
  reserved "controls";
}

// SAP 验证响应
message SAPVerifyResponse {}

// 加密服务
service CryptService {
  rpc ActivationSign(ActivationSignRequest) returns (ActivationSignResponse) {
    option (google.api.http) = { post: "/activation/sign" body: "*" };
  }

  // 初始化
  rpc Initialize(InitializeRequest) returns (InitializeResponse) {
    option (google.api.http) = {
      post: "/initialize"
      body: "*"
    };
  }

  // 同步设备状态，但不重新初始化 cryptor
  rpc SyncDevice(SyncDeviceRequest) returns (SyncDeviceResponse) {
    option (google.api.http) = {
      post: "/device/sync"
      body: "*"
    };
  }

  // 结束
  rpc Finalize(FinalizeRequest) returns (FinalizeResponse) {
    option (google.api.http) = {
      post: "/finalize"
      body: "*"
    };
  }

  // DRM 激活握手
  rpc DRMActivationHandshake(DRMActivationHandshakeRequest) returns (DRMActivationHandshakeResponse) {
    option (google.api.http) = {
      post: "/drm/activation/handshake"
      body: "*"
    };
  }

  // DRM 激活处理
  rpc DRMActivationProcessHandshake(DRMActivationProcessHandshakeRequest) returns (DRMActivationProcessHandshakeResponse) {
    option (google.api.http) = {
      post: "/drm/activation/process-handshake"
      body: "*"
    };
  }

  // DRM 激活签名
  rpc DRMActivationSign(DRMActivationSignRequest) returns (DRMActivationSignResponse) {
    option (google.api.http) = {
      post: "/drm/activation/sign"
      body: "*"
    };
  }

  // 旧版激活
  rpc ActivationSignInSession(ActivationSignInSessionRequest) returns (ActivationSignResponse) {
    option (google.api.http) = {
      post: "/activation/sign-in-session"
      body: "*"
    };
  }

  // 激活记录
  rpc DRMActivationExportState(DRMActivationExportStateRequest) returns (DRMActivationExportStateResponse) {
    option (google.api.http) = {
      post: "/drm/activation/export-state"
      body: "*"
    };
  }

  // ADI 开始配置
  rpc ADIStartProvisioning(ADIStartProvisioningRequest) returns (ADIStartProvisioningResponse) {
    option (google.api.http) = {
      post: "/adi/start-provisioning"
      body: "*"
    };
  }

  // ADI 结束配置
  rpc ADIEndProvisioning(ADIEndProvisioningRequest) returns (ADIEndProvisioningResponse) {
    option (google.api.http) = {
      post: "/adi/end-provisioning"
      body: "*"
    };
  }

  // ADI 生成登录码
  rpc ADIGenerateLoginCode(ADIGenerateLoginCodeRequest) returns (ADIGenerateLoginCodeResponse) {
    option (google.api.http) = {
      post: "/adi/generate-login-code"
      body: "*"
    };
  }

  // Absinthe Hello
  rpc AbsintheHello(AbsintheHelloRequest) returns (AbsintheHelloResponse) {
    option (google.api.http) = {
      post: "/absinthe/hello"
      body: "*"
    };
  }

  // Absinthe 添加选项
  rpc AbsintheAddOption(AbsintheAddOptionRequest) returns (AbsintheAddOptionResponse) {
    option (google.api.http) = {
      post: "/absinthe/add-option"
      body: "*"
    };
  }

  // Absinthe 激活会话
  rpc AbsintheActivateSession(AbsintheActivateSessionRequest) returns (AbsintheActivateSessionResponse) {
    option (google.api.http) = {
      post: "/absinthe/activate-session"
      body: "*"
    };
  }

  // Absinthe 签名数据
  rpc AbsintheSignData(AbsintheSignDataRequest) returns (AbsintheSignDataResponse) {
    option (google.api.http) = {
      post: "/absinthe/sign-data"
      body: "*"
    };
  }

  // NAC初始化
  rpc NACInit(NACInitRequest) returns (NACInitResponse) {
    option (google.api.http) = {
      post: "/nac/init"
      body: "*"
    };
  }

  // NAC生成校验数据
  rpc NACGenerateValidation(NACGenerateValidationRequest) returns (NACGenerateValidationResponse) {
    option (google.api.http) = {
      post: "/nac/generate-validation"
      body: "*"
    };
  }

  // SAP 交换
  rpc SAPExchange(SAPExchangeRequest) returns (SAPExchangeResponse) {
    option (google.api.http) = {
      post: "/sap/exchange"
      body: "*"
    };
  }

  // SAP 质数签名
  rpc SAPSignPrime(SAPSignPrimeRequest) returns (SAPSignPrimeResponse) {
    option (google.api.http) = {
      post: "/sap/sign-prime"
      body: "*"
    };
  }

  // SAP 质数验证
  rpc SAPVerifyPrime(SAPVerifyPrimeRequest) returns (SAPVerifyPrimeResponse) {
    option (google.api.http) = {
      post: "/sap/verify-prime"
      body: "*"
    };
  }

  // SAP 签名
  rpc SAPSign(SAPSignRequest) returns (SAPSignResponse) {
    option (google.api.http) = {
      post: "/sap/sign"
      body: "*"
    };
  }

  // SAP 验证
  rpc SAPVerify(SAPVerifyRequest) returns (SAPVerifyResponse) {
    option (google.api.http) = {
      post: "/sap/verify"
      body: "*"
    };
  }
}
